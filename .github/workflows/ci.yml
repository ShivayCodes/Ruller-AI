name: Python CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q ruller_ai tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify CLI starts and exits
        run: printf '/help\n/exit\n' | python -m ruller_ai --data-dir .ci-data
      - name: Remove test data
        if: always()
        run: rm -rf .ci-data
